<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1b26"/>
      <stop offset="55%" stop-color="#16303a"/>
      <stop offset="100%" stop-color="#1d4034"/>
    </linearGradient>
    <marker id="bh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8fa6b2"/>
    </marker>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="75" x2="1200" y2="75"/><line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="225" x2="1200" y2="225"/>
    <line x1="900" y1="0" x2="900" y2="300"/><line x1="1000" y1="0" x2="1000" y2="300"/>
    <line x1="1100" y1="0" x2="1100" y2="300"/>
  </g>

  <!-- title: measured 646px at 44 bold, starts x=60 -> ends 706, clear of glyph at 800 -->
  <text x="60" y="98" font-size="44" font-weight="bold" fill="#ffffff">ETL-TransBench <tspan fill="#7ec89b" font-weight="300">+ LEGATO</tspan></text>

  <text x="62" y="136" font-size="17" fill="#c9d6de">Translating legacy ETL to modern dataflow code, verified by</text>
  <text x="62" y="160" font-size="17" fill="#c9d6de">data equivalence instead of unit tests.</text>

  <!-- stat chips: widths >= measured label + 40px padding -->
  <g>
    <rect x="60" y="198" width="150" height="56" rx="7" fill="#ffffff" fill-opacity="0.07" stroke="#7ec89b" stroke-opacity="0.45"/>
    <text x="135" y="224" text-anchor="middle" font-size="21" font-weight="bold" fill="#ffffff">32</text>
    <text x="135" y="243" text-anchor="middle" font-size="12.5" fill="#a8bcc6">executable tasks</text>

    <rect x="226" y="198" width="156" height="56" rx="7" fill="#ffffff" fill-opacity="0.07" stroke="#7ec89b" stroke-opacity="0.45"/>
    <text x="304" y="224" text-anchor="middle" font-size="21" font-weight="bold" fill="#ffffff">8</text>
    <text x="304" y="243" text-anchor="middle" font-size="12.5" fill="#a8bcc6">construct families</text>

    <rect x="398" y="198" width="132" height="56" rx="7" fill="#ffffff" fill-opacity="0.07" stroke="#7ec89b" stroke-opacity="0.45"/>
    <text x="464" y="224" text-anchor="middle" font-size="21" font-weight="bold" fill="#ffffff">33</text>
    <text x="464" y="243" text-anchor="middle" font-size="12.5" fill="#a8bcc6">defect probes</text>

    <rect x="546" y="198" width="188" height="56" rx="7" fill="#7ec89b" fill-opacity="0.16" stroke="#7ec89b"/>
    <text x="640" y="224" text-anchor="middle" font-size="21" font-weight="bold" fill="#b8ecca">0.91 SER@5</text>
    <text x="640" y="243" text-anchor="middle" font-size="12.5" fill="#a8bcc6">at USD 1.20 total</text>
  </g>

  <!-- loop glyph, right side, clear of title -->
  <g transform="translate(830,58)" opacity="0.95">
    <rect x="0" y="26" width="112" height="34" rx="5" fill="none" stroke="#7ec89b" stroke-width="1.7"/>
    <text x="56" y="48" text-anchor="middle" font-size="12.5" fill="#dff3e7">translate</text>
    <rect x="160" y="26" width="112" height="34" rx="5" fill="none" stroke="#e0b44a" stroke-width="1.7"/>
    <text x="216" y="48" text-anchor="middle" font-size="12.5" fill="#f6e2b4">verify</text>
    <rect x="80" y="122" width="112" height="34" rx="5" fill="none" stroke="#e07a5f" stroke-width="1.7"/>
    <text x="136" y="144" text-anchor="middle" font-size="12.5" fill="#f7cfc4">repair</text>
    <path d="M 112 43 L 156 43" stroke="#8fa6b2" stroke-width="1.6" marker-end="url(#bh)"/>
    <path d="M 216 62 L 216 139 L 196 139" fill="none" stroke="#8fa6b2" stroke-width="1.6" marker-end="url(#bh)"/>
    <path d="M 80 139 L 56 139 L 56 64" fill="none" stroke="#8fa6b2" stroke-width="1.6" marker-end="url(#bh)"/>
    <text x="136" y="180" text-anchor="middle" font-size="12" fill="#9fb4bf" font-style="italic">grounded in counterexamples</text>
  </g>
</svg>
